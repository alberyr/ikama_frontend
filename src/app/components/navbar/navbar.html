<header class="navbar">
  <div class="navbar__container">
    
    <!-- Logotipo con enlace a la Home -->
    <a routerLink="/" class="navbar__brand">
      <span class="brand-name">ikama</span>
    </a>

    <!-- Enlaces de Navegación -->
    <nav class="navbar__links">
      <a 
        routerLink="/como-funciona" 
        routerLinkActive="active" 
        class="nav-link">
        Cómo funciona
      </a>
      <a 
        routerLink="/faqs" 
        routerLinkActive="active" 
        class="nav-link">
        Preguntas frecuentes
      </a>
    </nav>

    <!-- Botón de Acción -->
    <div class="navbar__actions">
      <p-button 
        label="Apúntate" 
        icon="pi pi-sparkles" 
        styleClass="nav-btn" 
        (onClick)="openProfileModal()" 
      />
    </div>

  </div>
</header>
