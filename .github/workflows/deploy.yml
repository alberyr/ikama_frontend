name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Display environment info
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Angular version in package.json:"
          grep "@angular/core" package.json

      - name: Install dependencies
        run: npm ci --verbose
        continue-on-error: false

      - name: Verify dependencies installed
        run: |
          echo "Checking @angular/core installation:"
          ls -la node_modules/@angular/core/package.json || echo "NOT FOUND!"
          echo "---"
          npm list @angular/core @angular/cli

      - name: Build Angular app for production
        run: npm run build:prod
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "=== Build Output Directory ==="
          ls -la dist/ikama_frontend/browser/ | head -20
          echo ""
          echo "=== Index.html Content (first 30 lines) ==="
          head -30 dist/ikama_frontend/browser/index.html
          echo ""
          echo "=== File Count ==="
          find dist/ikama_frontend/browser -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/ikama_frontend/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
